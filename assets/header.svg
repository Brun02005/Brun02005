<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-label="Terminal: Bruno Savarella, programador y desarrollador de software en Córdoba, Argentina">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; white-space: pre; }
    .title { fill: #8b949e; font-size: 13px; }
    .prompt { fill: #ffffff; font-weight: 700; }
    .cmd { fill: #e6edf3; }
    .out { fill: #8b949e; }
    .hi { fill: #ffffff; }
    .fade { opacity: 0; animation: fade .25s ease-out forwards; }
    .type { animation-name: type; animation-fill-mode: both; animation-timing-function: steps(var(--n)); }
    .cursor { animation: blink 1s steps(1) infinite; }
    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: eq .9s ease-in-out infinite alternate; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes type { from { transform: translateX(0); } to { transform: translateX(var(--w)); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes eq { 0% { transform: scaleY(.2); } 100% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) {
      .fade { animation: none; opacity: 1; }
      .type { display: none; }
      .bar { animation: none; }
    }
  </style>

  <!-- ventana -->
  <rect x="1" y="1" width="858" height="348" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M1 11 a10 10 0 0 1 10 -10 h838 a10 10 0 0 1 10 10 v27 h-858 z" fill="#161b22"/>
  <line x1="1" y1="38" x2="859" y2="38" stroke="#30363d" stroke-width="1"/>
  <circle cx="24" cy="20" r="6" fill="none" stroke="#6e7681" stroke-width="1.5"/>
  <circle cx="44" cy="20" r="6" fill="none" stroke="#6e7681" stroke-width="1.5"/>
  <circle cx="64" cy="20" r="6" fill="#6e7681"/>
  <text class="title" x="430" y="24" text-anchor="middle">λ bruno@cordoba: ~</text>

  <!-- 1: whoami -->
  <g class="fade" style="animation-delay:.3s">
    <text class="prompt" x="28" y="76">bruno@cordoba:~$</text>
  </g>
  <text class="cmd" x="192" y="76">whoami</text>
  <rect class="type" x="188" y="60" width="80" height="22" fill="#0d1117" style="--n:6;--w:80px;animation-duration:.45s;animation-delay:.6s"/>
  <g class="fade" style="animation-delay:1.25s">
    <text x="28" y="102"><tspan class="hi" font-weight="700">Bruno Savarella</tspan><tspan class="out"> · programador y desarrollador de software</tspan></text>
  </g>

  <!-- 2: sobre mí -->
  <g class="fade" style="animation-delay:1.6s">
    <text class="prompt" x="28" y="138">bruno@cordoba:~$</text>
  </g>
  <text class="cmd" x="192" y="138">cat sobre_mi.txt</text>
  <rect class="type" x="188" y="122" width="180" height="22" fill="#0d1117" style="--n:16;--w:180px;animation-duration:.8s;animation-delay:1.8s"/>
  <g class="fade" style="animation-delay:2.75s">
    <text class="out" x="28" y="164">Ingeniería en Sistemas @ UTN · Córdoba, Argentina</text>
  </g>

  <!-- 3: proyectos -->
  <g class="fade" style="animation-delay:3.1s">
    <text class="prompt" x="28" y="200">bruno@cordoba:~$</text>
  </g>
  <text class="cmd" x="192" y="200">ls proyectos/</text>
  <rect class="type" x="188" y="184" width="150" height="22" fill="#0d1117" style="--n:13;--w:150px;animation-duration:.65s;animation-delay:3.3s"/>
  <g class="fade" style="animation-delay:4.1s">
    <text class="hi" x="28" y="226">WaveLoad/  mathvision-ai/  control-acceso-facial/  BLUE-DAR/  foxtrot-sur/</text>
  </g>

  <!-- 4: bruno.js -->
  <g class="fade" style="animation-delay:4.45s">
    <text class="prompt" x="28" y="262">bruno@cordoba:~$</text>
  </g>
  <text class="cmd" x="192" y="262">node bruno.js --play --bpm 122</text>
  <rect class="type" x="188" y="246" width="330" height="22" fill="#0d1117" style="--n:30;--w:330px;animation-duration:1.3s;animation-delay:4.65s"/>
  <g class="fade" style="animation-delay:6.1s">
    <text class="out" x="28" y="288">♪ house · sonando en Web Audio</text>
    <g fill="#e6edf3">
      <rect class="bar" x="308" y="272" width="5" height="18" style="animation-delay:-.1s"/>
      <rect class="bar" x="317" y="272" width="5" height="18" style="animation-delay:-.5s;animation-duration:.7s"/>
      <rect class="bar" x="326" y="272" width="5" height="18" style="animation-delay:-.3s;animation-duration:1.1s"/>
      <rect class="bar" x="335" y="272" width="5" height="18" style="animation-delay:-.8s;animation-duration:.6s"/>
      <rect class="bar" x="344" y="272" width="5" height="18" style="animation-delay:-.2s;animation-duration:.95s"/>
      <rect class="bar" x="353" y="272" width="5" height="18" style="animation-delay:-.6s;animation-duration:.75s"/>
      <rect class="bar" x="362" y="272" width="5" height="18" style="animation-delay:-.4s;animation-duration:1.05s"/>
      <rect class="bar" x="371" y="272" width="5" height="18" style="animation-delay:-.7s;animation-duration:.65s"/>
      <rect class="bar" x="380" y="272" width="5" height="18" style="animation-delay:-.15s;animation-duration:.85s"/>
      <rect class="bar" x="389" y="272" width="5" height="18" style="animation-delay:-.55s;animation-duration:1s"/>
    </g>
  </g>

  <!-- prompt final -->
  <g class="fade" style="animation-delay:6.5s">
    <text class="prompt" x="28" y="324">bruno@cordoba:~$</text>
    <rect class="cursor" x="192" y="310" width="10" height="18" fill="#e6edf3"/>
  </g>
</svg>
